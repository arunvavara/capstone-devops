# ============================================================
# Docker Compose for Capstone Project
# Services: app1, app2, mysql, redis
# ============================================================

version: '3.8'

services:

  # ── MySQL Database ─────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: capstonedb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis Cache ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Flask App Instance 1 ───────────────────────────────────
  app1:
    build: .
    container_name: flask-app-1
    restart: unless-stopped
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URI: mysql+pymysql://appuser:apppass@mysql:3306/capstonedb
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # ── Flask App Instance 2 ───────────────────────────────────
  app2:
    build: .
    container_name: flask-app-2
    restart: unless-stopped
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URI: mysql+pymysql://appuser:apppass@mysql:3306/capstonedb
    ports:
      - "5001:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # ── DB Init (runs once to create tables) ──────────────────
  db-init:
    build: .
    container_name: db-init
    restart: "no"
    environment:
      DATABASE_URI: mysql+pymysql://appuser:apppass@mysql:3306/capstonedb
    command: python create_db.py
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

# ── Volumes ────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local

# ── Networks ───────────────────────────────────────────────
networks:
  app-network:
    driver: bridge
