# ============================================================
# configmap.yml - Environment Variables for Flask App
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: capstone
data:
  APP_HOST: "0.0.0.0"
  APP_PORT: "5000"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  DATABASE_URI: "mysql+pymysql://appuser:apppass@mysql-service:3306/capstonedb"
