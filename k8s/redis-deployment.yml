# ============================================================
# redis-deployment.yml - Redis Cache
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: capstone
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 5
      restartPolicy: Always

---
# ============================================================
# redis-service.yml - Redis Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: capstone
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP
