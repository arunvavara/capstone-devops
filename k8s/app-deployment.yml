# ============================================================
# app-deployment.yml - Flask Application (2 replicas)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: capstone
  labels:
    app: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: flask-app
          image: 464813693523.dkr.ecr.us-west-2.amazonaws.com/capstone-flask-app:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /status
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /status
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
      restartPolicy: Always

---
# ============================================================
# app-service.yml - Flask App Service (NodePort for HTTP access)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: flask-app-service
  namespace: capstone
spec:
  selector:
    app: flask-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
      nodePort: 30000
  type: NodePort
